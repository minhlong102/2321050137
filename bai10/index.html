<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10 - Luyện tập JS</title>
</head>
<body>
    <script>
        // =============================
        // 1. Lấy ngày hiện tại
        // =============================
        let today = new Date();
        let theDay = today.getDay(); // 0 = Chủ nhật

        switch (theDay) {
            case 5:
                document.writeln("Finally Friday!<br>");
                break;
            case 6:
                document.writeln("Super Saturday!<br>");
                break;
            default:
                document.writeln("I'm looking forward to this weekend<br>");
        }

        // =============================
        // 2. Mảng số
        // =============================
        let arrNum = [0, 1, 2, 3, 4, 5];
        document.writeln("Phần tử cuối: " + arrNum[arrNum.length - 1] + "<br>");
        for (let j = 0; j < arrNum.length; j++) {
            document.writeln("arrNum[" + j + "] = " + arrNum[j] + "<br>");
        }

        // =============================
        // 3. Mảng tên
        // =============================
        let danhSach = [
            "Lương Ngọc Bích",
            "Dương Gia Bình",
            "Nguyễn Như Thành Danh",
            "Hoàng Xuân Duẩn",
            "Hà Văn Dũng"
        ];

        for (let z = 0; z < danhSach.length; z++) {
            document.writeln("Xin chào " + danhSach[z] + "<br>");
        }

        // =============================
        // 4. Hàm cơ bản
        // =============================
        function sayHello() {
            document.writeln("Hello!<br>");
        }
        sayHello();

        function sayHello2(name, age) {
            document.writeln("Hello " + name + ", " + age + " tuổi<br>");
        }

        // gọi với giá trị cố định
        sayHello2("Bách", 18);

        // gọi với giá trị người nhập
        let nameP = prompt("Nhập tên:", "Tên của bạn");
        let ageP = prompt("Nhập tuổi:", "0");
        sayHello2(nameP, ageP);

        // =============================
        // 5. Biến toàn cục & cục bộ
        // =============================
        let globalName = "Anh Phương Tuấn";
        function sayHelloGlobal() {
            document.writeln("Hello " + globalName + "<br>");
        }
        sayHelloGlobal();

        // =============================
        // 6. While loop
        // =============================
        let i = 0;
        while (i <= 10) {
            document.writeln("The number is " + i + "<br>");
            i++;
        }

        // =============================
        // 7. Kiểm tra số chẵn / lẻ
        // =============================
        let N1 = prompt("Mời bạn nhập số:");
        N1 = Number(N1);

        if (isNaN(N1)) {
            document.writeln("Vui lòng nhập vào số hợp lệ!<br>");
        } else {
            if (N1 % 2 === 0) {
                document.writeln(N1 + " là số chẵn<br>");
            } else {
                document.writeln(N1 + " là số lẻ<br>");
            }
        }
    </script>
</body>
</html>
